  <rect x="36" y="44" width="36" height="4.5" rx="2.25" fill="url(#streamGrad)"/>
  <rect x="42" y="58" width="26" height="4.5" rx="2.25" fill="url(#streamGrad)"/>
  <rect x="36" y="72" width="36" height="4.5" rx="2.25" fill="url(#streamGrad)"/>
