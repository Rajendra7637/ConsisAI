<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Background subtle gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0"/>
    </radialGradient>

    <!-- Main Arc Gradient (Cyan to Indigo) -->
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Neural Stream Gradient -->
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#60a5fa" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Spark Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow circle -->
  <circle cx="60" cy="60" r="54" fill="url(#bgGlow)"/>

  <!-- Stylized Letter 'C' Outer Crest -->
  <path d="M 86 32 C 78 22, 65 18, 52 20 C 33 23, 20 39, 20 60 C 20 81, 33 97, 52 100 C 66 102, 79 97, 87 86" 
        stroke="url(#arcGrad)" 
        stroke-width="8" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Inner Converging Neural Data Beams (Text -> Essence) -->
  <!-- Top Beam (Long) -->
  <rect x="36" y="44" width="36" height="4.5" rx="2.25" fill="url(#streamGrad)"/>
  <!-- Middle Beam (Medium) -->
  <rect x="42" y="58" width="26" height="4.5" rx="2.25" fill="url(#streamGrad)"/>
  <!-- Bottom Beam (Long) -->
  <rect x="36" y="72" width="36" height="4.5" rx="2.25" fill="url(#streamGrad)"/>

  <!-- Core Synthesis Focal Spark (Distilled Essence) -->
  <g transform="translate(84, 58)" filter="url(#glow)">
    <!-- Central Diamond Core -->
    <polygon points="0,-9 7,0 0,9 -7,0" fill="#38bdf8"/>
    <polygon points="0,-5 4,0 0,5 -4,0" fill="#ffffff"/>
    <!-- Radiance Points -->
    <circle cx="0" cy="0" r="2.5" fill="#ffffff"/>
  </g>
</svg>
